apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-platform-labels
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-owner-and-service
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
      validate:
        message: "Workloads must declare owner and service labels."
        pattern:
          metadata:
            labels:
              owner: "?*"
              service: "?*"
