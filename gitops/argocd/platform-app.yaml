apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-workloads
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SanithBaddam/platform-k8s-terraform.git
    targetRevision: main
    path: helm
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
